name: Track 2 installation
on:
  push:
    paths:
      - 'Track 2/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/track2-install.yml'
  pull_request:
    paths:
      - 'Track 2/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/track2-install.yml'
defaults:
  run:
    working-directory: 'Track 2'
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install CPU wheels
        run: python -m pip install torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Import training and inference in the same interpreter
        run: |
          python - <<'PY'
          from llamafactory.train.tuner import run_exp
          from peft import PeftModel
          from transformers import AutoModel
          from eval.infer import load_model
          PY
