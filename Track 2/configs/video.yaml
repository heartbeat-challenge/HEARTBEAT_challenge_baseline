model_name_or_path: ./models/Realtime-Venus-Omni
trust_remote_code: true
low_cpu_mem_usage: true
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 128
lora_alpha: 256
lora_dropout: 0.05
lora_target: q_proj,v_proj
dataset_dir: ./prepared/video/train
dataset: heartbeat_video_train
template: minicpm_o
minicpmo_runtime_processing: true
minicpmo_max_video_seconds: 640
minicpmo_offline_max_frames: 128
minicpmo_offline_long_video_fps: 10.0
minicpmo_tail_listen_units: 640
minicpmo_max_expanded_length: 65536
minicpmo_ref_audio_prob: 0.0
minicpmo_offline_full_attention_prob: 0
ddp_find_unused_parameters: false
overwrite_output_dir: false
overwrite_cache: false
preprocessing_num_workers: 1
minicpmo_train_vision_encoder: false
minicpmo_train_vision_projector: false
minicpmo_train_audio_encoder: false
minicpmo_train_audio_projector: false
minicpmo_train_llm: true
minicpmo_listen_weight: 1.0
minicpmo_speak_weight: 1.0
minicpmo_spoken_text_weight: 1.0
minicpmo_offline_text_weight: 1.0
minicpmo_offline_instruct_mode: true
minicpmo_duplex_sample_weight: 1.0
minicpmo_offline_sample_weight: 1.0
minicpmo_loss_normalization: per_sample
minicpmo_use_stream_focal_loss: false
minicpmo_stream_focal_gamma: 2.0
minicpmo_stream_focal_auto_alpha: true
minicpmo_lm_head_chunk_size: 128
output_dir: ./outputs/venus_video
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-05
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
pure_bf16: true
gradient_checkpointing: true
disable_gradient_checkpointing: false
use_reentrant_gc: false
eval_strategy: 'no'
save_strategy: steps
save_steps: 200
save_total_limit: 3
load_best_model_at_end: false
metric_for_best_model: eval_loss
greater_is_better: false
report_to: none
logging_steps: 1
dataloader_num_workers: 2
flash_attn: sdpa
max_steps: -1
seed: 42
data_seed: 42
